<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leifis Karaoke - By Meitzi - For The Mario Kart Team =)</title>
    <style>
        h1,
        h3 {
            padding: 0;
            margin: 0;
            text-transform: capitalize;
            text-align: center;
        }

        h3 {
            padding-bottom: 20px;
        }

        h2 {
            color: #fff;
            font-size: 6rem;
            text-transform: uppercase;
        }

        html {
            height: auto;
        }

        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            position: relative;
            margin: 0;
            padding: 40px 0 0 0;
        }

        .splash {
            inset: 0;
            position: absolute;
            z-index: 10;
            animation: splashfade 1s 1s 1 forwards;
            
            display: flex;
            background: orange;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap; 
            text-align: center;
            padding: 0 1rem;
            height: 100dvh;
        }

        h2 {
            animation: textfade 1s 1s 1 forwards;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            margin: 0;
        }

        @keyframes splashfade {
            0%, 40% {
                opacity: 1;
                visibility: visible;
            }
            100% {
        opacity: 0;
        visibility: hidden;
            }
        }



        .soundboard {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
        
        }

        /* Nice, clicky button styling */
        button {
            padding: 20px 10px;
            font-size: 16px;
            font-weight: bold;
            background: #232526;
            background: -webkit-linear-gradient(to right, #414345, #232526);
            background: linear-gradient(to right, #414345, #232526);
            color: #fff;
            border: 2px solid #333;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.1s ease;
            text-transform: capitalize;
        }

        button:hover {
            background-color: #333;
            border-color: #555;
        }

        button:active {
            transform: scale(0.95);
            background-color: #007acc;
            border-color: #007acc;
        }
    </style>
</head>

<body>

    <div class="splash">
        <h2>såja!</h2>
    </div>

    <h1>Leifis Karaoke</h1>
    <h3>Nya tider - Klassisk Leifi</h3>

    <!-- 1. Just add your new buttons inside this div container -->
    <div class="soundboard">
          <button data-sound="audio/Halo.m4a">Halo 1</button>
        <button data-sound="audio/Halo_2.m4a">Halo 2</button>

        <button data-sound="audio/Sa.m4a">Så</button>
        <button data-sound="audio/So_2.m4a">Så 2</button>

        <button data-sound="audio/Mitt_Namn_e.m4a">De här e Leifi</button>
        <button data-sound="audio/Tjena_Fetknoppe.m4a">Tjena Fetknoppe</button>

        <button data-sound="audio/Komma_Over.m4a">komma över</button>
        <button data-sound="audio/Mo_Bra.m4a">Må bra eller</button>

        <button data-sound="audio/Lona_Mig_Bilen.m4a">låna mig bilen</button>
        <button data-sound="audio/Trosta_sig.m4a">Trösta sig</button>

        <button data-sound="audio/Borjar_grata.m4a">Börjar gråta</button>
        <button data-sound="audio/Varfor_Halla_sig_pa.m4a">Varför du håller sig på nu</button>
    
        <button data-sound="audio/Bjuda_brass.m4a">bjuda brass</button>
        <button data-sound="audio/Knarka_sig.m4a">knarka sig lite</button>
   

        <button data-sound="audio/Men_Saatana.m4a">Men Saatana</button>
        <button data-sound="audio/Saatana_perkele.m4a">saatana perkele</button>
        <button data-sound="audio/Karaoke.m4a">Karaoke</button>
        <button data-sound="audio/One_Two_Three.m4a">one two three</button>
        <button data-sound="audio/Till_Leifi.m4a">Till Leifi</button>
        <button data-sound="audio/Lessen_Farmor.m4a">Lessen Farmor</button>
        <button data-sound="audio/Tarja_Resa.m4a">Tarja resa</button>
        <button data-sound="audio/Sa_Dugillar_sig_ta.m4a">Gillar sig ta</button>
        <button data-sound="audio/Vi_e_zigenare.m4a">Vi e zigenare</button>
        <button data-sound="audio/Komma_hem_middag.m4a">Komma hem middag</button>
        <button data-sound="audio/Din_namn.m4a">Va hette Din namn</button>
        <button data-sound="audio/Pappa_ska.m4a">Pappa ska</button>
        <button data-sound="audio/Holka_sig.m4a">Holka sig</button>
        <button data-sound="audio/Inga_problem.m4a">Inga problem</button>
    </div>

    <script>
        // Holds active audio instances so the browser cannot delete them mid-play
        const aktiivisetAanet = new Set();

        document.body.addEventListener('click', function (event) {
            const soundFile = event.target.getAttribute('data-sound');

            if (soundFile) {
                let audio = new Audio(soundFile);

                // 1. Add it to our active collection to shield it from garbage collection
                aktiivisetAanet.add(audio);

                audio.play();

                // 2. Once it safely finishes, remove it so memory stays clean
                audio.addEventListener('ended', function () {
                    aktiivisetAanet.delete(audio);
                });
            }
        });
    </script>

</body>

</html>
